<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteTech - Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0b0f19; color: #f3f4f6; padding: 30px; }
        h1 { color: #d4af37; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1a2234; padding: 20px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); }
        .stat-card h3 { color: #9ca3af; font-size: 0.9rem; margin-bottom: 8px; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; color: #d4af37; }
        table { width: 100%; border-collapse: collapse; background: #1a2234; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #121826; color: #d4af37; }
        .loading { text-align: center; color: #9ca3af; padding: 20px; }
        .refresh-btn { background: #d4af37; color: #0b0f19; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        .refresh-btn:hover { background: #b3922b; }
    </style>
</head>
<body>
    <h1>Painel de Controle — WhiteTech Admin</h1>

    <div class="stats-grid">
        <div class="stat-card"><h3>Total de Pedidos</h3><p id="total-orders">-</p></div>
        <div class="stat-card"><h3>Faturamento Estimado</h3><p id="total-revenue">R$ 0,00</p></div>
        <div class="stat-card"><h3>Itens no Catálogo</h3><p>6</p></div>
    </div>

    <button class="refresh-btn" onclick="loadAdminDataFromSupabase()">🔄 Atualizar Dados</button>

    <h2>Últimos Pedidos & Endereços de Entrega</h2>
    <br>
    <table>
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Endereço de Entrega</th>
                <th>Pagamento</th>
                <th>Total</th>
                <th>Data do Pedido</th>
            </tr>
        </thead>
        <tbody id="orders-table-body">
            <tr><td colspan="5" class="loading">Conectando ao banco de dados Supabase...</td></tr>
        </tbody>
    </table>

    <script>
        // ==================== CONFIGURAÇÃO SUPABASE ====================
        const SUPABASE_URL = 'https://yepeksvpqmjusfrhdfzm.supabase.co';
        // Usando a chave ANON (segura). As políticas RLS do Supabase permitem o select.
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllcGVrc3ZwcW1qdXNmcmhkZnptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMjQ2NDQsImV4cCI6MjEwNzcwMDY0NH0.5A9FSO32dMpm9dCXSrq9ynGiEZXZvXKDlcW4cfNN5DI';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdminDataFromSupabase() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="loading">Carregando...</td></tr>`;

            const { data: orders, error } = await _supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao buscar dados:', error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff6b6b;">Erro: ${error.message}</td></tr>`;
                return;
            }

            document.getElementById('total-orders').innerText = orders.length;
            const rev = orders.reduce((sum, o) => sum + Number(o.total), 0);
            document.getElementById('total-revenue').innerText = `R$ ${rev.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af;">Nenhum pedido registrado ainda.</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>${o.client}</td>
                    <td>${o.address}</td>
                    <td>${o.payment}</td>
                    <td>R$ ${Number(o.total).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td>${new Date(o.created_at).toLocaleString('pt-BR')}</td>
                </tr>
            `).join('');
        }

        window.onload = loadAdminDataFromSupabase;
    </script>
</body>
</html>
