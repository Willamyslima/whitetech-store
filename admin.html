<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhiteTech - Painel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0b0f19; color: #f3f4f6; padding: 30px; }
        h1 { color: #d4af37; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1a2234; padding: 20px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2); }
        .stat-card h3 { color: #9ca3af; font-size: 0.9rem; margin-bottom: 8px; }
        .stat-card p { font-size: 1.8rem; font-weight: bold; color: #d4af37; }
        table { width: 100%; border-collapse: collapse; background: #1a2234; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: #121826; color: #d4af37; }
        .loading { text-align: center; color: #9ca3af; padding: 20px; }
        .refresh-btn { background: #d4af37; color: #0b0f19; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
        .refresh-btn:hover { background: #b3922b; }
    </style>
</head>
